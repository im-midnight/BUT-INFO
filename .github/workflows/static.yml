# Publie le site sur GitHub Pages à chaque push sur main.
# Le site principal reste sur Vercel ; ceci n'alimente que la copie github.io.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # Permet de relancer à la main depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Prépare le paquet "github-pages" avec les fichiers du site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: .

  # 2. Publie le paquet, dans un job séparé (GitHub met parfois
  #    quelques secondes à "voir" le paquet qui vient d'être envoyé)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.essai1.outputs.page_url || steps.essai2.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: essai1
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Attendre avant de réessayer
        if: steps.essai1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (2e essai)
        id: essai2
        if: steps.essai1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
