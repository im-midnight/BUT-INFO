<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable | BUT Info Nantes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    // Thème posé tout de suite pour éviter un flash de couleur ; le reste de site.js est en defer.
    // Clé et valeurs par défaut : les mêmes que DEFAUT dans assets/js/site.js.
    (function () { var r = { theme: "bleu", mode: "clair", hc: false, syntaxe: true }; try { Object.assign(r, JSON.parse(localStorage.getItem("butinfo-reglages") || "{}")); } catch (e) {} var h = document.documentElement; h.dataset.theme = r.theme; h.dataset.mode = r.mode; h.dataset.syntaxe = r.syntaxe ? "on" : "off"; if (r.hc) h.dataset.hc = "on"; })();
  </script>
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/script.js" defer></script>
</head>
<body>
  <h1>Page introuvable</h1>
  <p class="consigne">Cette adresse ne mène à aucune page du site. Le cours a peut-être été déplacé ou renommé.</p>
  <div class="page-vide">
    <h2>Retrouver un cours</h2>
    <p>Tous les cours, TD et TP sont listés sur l'accueil, avec une recherche.</p>
    <a class="btn-lien" href="/">Aller à l'accueil</a>
  </div>
</body>
</html>
